name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # The plugin is Windows-only (install.ps1, vswhere, scheduled-task restarts), so that is the
    # platform the suites actually claim to cover.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    defaults:
      run:
        working-directory: dsh-rust-anything

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Each suite prints its own failures; re-emitting them as ::error:: makes them readable as
      # check-run annotations, which is the only part of a run the API exposes without a token.
      - name: selftest (bundle shape, files list, patch row)
        shell: pwsh
        run: ../.github/run-suite.ps1 tests/selftest.mjs

      - name: clienttest (page module factory, slots)
        shell: pwsh
        run: ../.github/run-suite.ps1 tests/clienttest.mjs

      - name: hosttest (tools, surface switch, HTTP routes, jobs)
        shell: pwsh
        run: ../.github/run-suite.ps1 tests/hosttest.mjs

      - name: installtest (installer dry run, real install, uninstall)
        shell: pwsh
        run: ../.github/run-suite.ps1 tests/installtest.mjs

  lint:
    # A colon inside an unquoted value once turned this file invalid and every run died with
    # "Invalid workflow file" and zero jobs. actionlint catches that plus unknown keys, bad `uses`
    # refs, expression syntax and shellcheck on the run blocks -- a hand-rolled parser would only
    # have covered the one case.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: error